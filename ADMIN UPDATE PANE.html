    .btn-logout:hover { background: var(--magenta); color: #000; box-shadow: var(--glow-m); }
    .btn-primary { background: var(--cyan); color: #000; font-weight: 900; box-shadow: var(--glow-c); }

  <script>
    // --- TAB SYSTEM ---
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // --- FILE UPLOAD HANDLER ---
    const MAX_IMAGE_DIMENSION = 1600;
    const IMAGE_JPEG_QUALITY = 0.72;
    const MAX_NON_IMAGE_FILE_SIZE = 2 * 1024 * 1024; // 2MB - localStorage has a hard ~5-10MB quota

    // Downscales + re-encodes as JPEG so uploaded images don't blow the localStorage quota.
    // Drops alpha transparency, which is fine for photographic content blocks.
    function compressImageFile(file, maxDimension, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = function() {
          URL.revokeObjectURL(objectUrl);
          let { width, height } = img;
          if (width > maxDimension || height > maxDimension) {
            if (width >= height) { height = Math.round(height * (maxDimension / width)); width = maxDimension; }
            else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function() { URL.revokeObjectURL(objectUrl); reject(new Error('Could not load image for compression.')); };
        img.src = objectUrl;
      });
    }

    function handleFileUpload(inputElem) {
      const file = inputElem.files[0];
      if (!file) return;
      const textInput = inputElem.parentElement.querySelector('.block-input');

      if (file.type.startsWith('image/')) {
        compressImageFile(file, MAX_IMAGE_DIMENSION, IMAGE_JPEG_QUALITY)
          .then(dataUrl => { if (textInput) textInput.value = dataUrl; })
          .catch(err => alert("Failed to process image: " + err.message));
        return;
      }

      if (file.size > MAX_NON_IMAGE_FILE_SIZE) {
        alert(`"${file.name}" is ${(file.size / 1024 / 1024).toFixed(1)}MB, which is too large to store directly (limit ${MAX_NON_IMAGE_FILE_SIZE / 1024 / 1024}MB). Please use a smaller file, or paste an external URL/link into the field instead of uploading.`);
        inputElem.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        if (textInput) textInput.value = e.target.result;
      };
      reader.onerror = function() { alert("Failed to read file."); };
      reader.readAsDataURL(file);
    }

    // --- DYNAMIC BLOCK BUILDER UTILITIES ---
    function addBlock(containerId, type, initialVal = '') {
      const container = document.getElementById(containerId);
      const blockDiv = document.createElement('div');
      blockDiv.className = 'block-item';
      blockDiv.setAttribute('data-type', type);

      let inputHtml = '';
      if (type === 'subheading') inputHtml = `<input type="text" class="block-input" value="${initialVal}" placeholder="Type sub heading...">`;
      else if (type === 'paragraph') inputHtml = `<textarea rows="3" class="block-input" placeholder="Type paragraph content...">${initialVal}</textarea>`;
      else if (type === 'quote') inputHtml = `<textarea rows="2" class="block-input" placeholder="Type quote text...">${initialVal}</textarea>`;
      else if (type === 'image') inputHtml = `<div style="display: flex; gap: 8px;"><input type="text" class="block-input" value="${initialVal}" placeholder="Paste Image URL or Browse..." style="flex:1;"><input type="file" accept="image/*" style="display:none;" onchange="handleFileUpload(this)"><button type="button" class="btn-hud outline" onclick="this.previousElementSibling.click()"><i class="bi bi-folder2-open"></i> Browse</button></div>`;
      else if (type === 'video') inputHtml = `<div style="display: flex; gap: 8px;"><input type="text" class="block-input" value="${initialVal}" placeholder="Paste Video URL or Browse..." style="flex:1;"><input type="file" accept="video/*" style="display:none;" onchange="handleFileUpload(this)"><button type="button" class="btn-hud outline" onclick="this.previousElementSibling.click()"><i class="bi bi-folder2-open"></i> Browse</button></div>`;
      else if (type === 'document') inputHtml = `<div style="display: flex; gap: 8px;"><input type="text" class="block-input" value="${initialVal}" placeholder="Paste Document Link or Browse..." style="flex:1;"><input type="file" accept=".pdf,.doc,.docx,.txt" style="display:none;" onchange="handleFileUpload(this)"><button type="button" class="btn-hud outline" onclick="this.previousElementSibling.click()"><i class="bi bi-folder2-open"></i> Browse</button></div>`;
      else if (type === 'drive') inputHtml = `<input type="text" class="block-input" value="${initialVal}" placeholder="Paste Google Drive share link (e.g. https://drive.google.com/file/d/.../view?usp=sharing)">`;

      blockDiv.innerHTML = `<div class="block-header"><span class="block-header-left"><i class="bi bi-grip-vertical drag-handle" draggable="true" title="Drag to reorder"></i><span class="block-label"><i class="bi bi-layers"></i> ${type.toUpperCase()} BLOCK</span></span><button type="button" class="btn-hud btn-danger" style="padding: 2px 6px; font-size: 8px;" onclick="this.closest('.block-item').remove()"><i class="bi bi-x-lg"></i> Remove</button></div>${inputHtml}`;
      container.appendChild(blockDiv);
    }

    // --- DRAG & DROP BLOCK REORDERING ---
    let draggedBlock = null;

    document.addEventListener('dragstart', (e) => {
      const handle = e.target.closest('.drag-handle');
      if (!handle) return;
      draggedBlock = handle.closest('.block-item');
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => draggedBlock && draggedBlock.classList.add('dragging'), 0);
    });

    document.addEventListener('dragend', () => {
      if (draggedBlock) draggedBlock.classList.remove('dragging');
      document.querySelectorAll('.block-item.drag-over').forEach(el => el.classList.remove('drag-over'));
      draggedBlock = null;
    });

    document.addEventListener('dragover', (e) => {
      if (!draggedBlock) return;
      const container = e.target.closest('.block-list');
      if (!container || !container.contains(draggedBlock)) return;
      e.preventDefault();

      const siblings = [...container.querySelectorAll('.block-item:not(.dragging)')];
      const nextSibling = siblings.find(el => {
        const box = el.getBoundingClientRect();
        return e.clientY <= box.top + box.height / 2;
      });

      container.querySelectorAll('.block-item.drag-over').forEach(el => el.classList.remove('drag-over'));
      if (nextSibling) nextSibling.classList.add('drag-over');

      container.insertBefore(draggedBlock, nextSibling || null);
    });

    function extractBlocks(containerId) {
      const container = document.getElementById(containerId);
      const blockElements = container.querySelectorAll('.block-item');
      const blocks = [];
      blockElements.forEach(el => {
        const type = el.getAttribute('data-type');
        const input = el.querySelector('.block-input');
        const val = input ? input.value : '';
        if (type === 'paragraph' || type === 'quote' || type === 'subheading') blocks.push({ type: type, value: val });
        else blocks.push({ type: type, url: val });
      });
      return blocks;
    }

    function renderBlocksIntoContainer(containerId, blocks) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!blocks || !Array.isArray(blocks)) return;
      blocks.forEach(b => {
        const val = (b.type === 'paragraph' || b.type === 'quote' || b.type === 'subheading') ? (b.value || '') : (b.url || '');
        addBlock(containerId, b.type, val);
      });
    }

    // --- RENDER ALL DATA ---
    function renderData() {
      const blogs = JSON.parse(localStorage.getItem('umuzi_blogs')) || [];
      const impacts = JSON.parse(localStorage.getItem('umuzi_impacts')) || [];
      const roles = JSON.parse(localStorage.getItem('umuzi_roles')) || [];

      // Blogs
      document.getElementById('blogTableBody').innerHTML = blogs.map((b, idx) => `<tr><td><span class="badge ${b.variant ? 'badge-' + b.variant : 'badge-cyan'}">${b.variant || 'cyan'}</span></td><td>${b.title}</td><td>${b.author || 'N/A'} <br><span style="color:var(--cyan); font-size:8px;">${b.date || 'N/A'}</span></td><td><span class="badge badge-cyan">${(b.blocks || []).length} blocks</span></td><td><div class="action-cell"><button class="btn-hud" style="background: rgba(0,245,255,0.1); color: var(--cyan); padding: 4px 8px;" onclick="editBlog(${idx})"><i class="bi bi-pencil"></i></button><button class="btn-hud btn-danger" style="padding: 4px 8px;" onclick="deleteBlog(${idx})"><i class="bi bi-trash"></i></button></div></td></tr>`).join('');

      // Impacts
      document.getElementById('impactTableBody').innerHTML = impacts.map((imp, idx) => `<tr><td><span class="badge ${imp.variant ? 'badge-' + imp.variant : 'badge-cyan'}">${imp.variant || 'cyan'}</span></td><td>${imp.title}</td><td>${imp.author || 'N/A'} <br><span style="color:var(--cyan); font-size:8px;">${imp.date || 'N/A'}</span></td><td><span class="badge badge-cyan">${(imp.blocks || []).length} blocks</span></td><td><div class="action-cell"><button class="btn-hud" style="background: rgba(0,245,255,0.1); color: var(--cyan); padding: 4px 8px;" onclick="editImpact(${idx})"><i class="bi bi-pencil"></i></button><button class="btn-hud btn-danger" style="padding: 4px 8px;" onclick="deleteImpact(${idx})"><i class="bi bi-trash"></i></button></div></td></tr>`).join('');

      // Roles
      document.getElementById('roleTableBody').innerHTML = roles.map((r, idx) => `<tr><td><span class="badge ${r.variant ? 'badge-' + r.variant : 'badge-cyan'}">${r.variant || 'cyan'}</span></td><td>${r.title}</td><td>${r.location || 'N/A'}</td><td><span class="badge badge-cyan">${(r.blocks || []).length} blocks</span></td><td><div class="action-cell"><button class="btn-hud" style="background: rgba(0,245,255,0.1); color: var(--cyan); padding: 4px 8px;" onclick="editRole(${idx})"><i class="bi bi-pencil"></i></button><button class="btn-hud btn-danger" style="padding: 4px 8px;" onclick="deleteRole(${idx})"><i class="bi bi-trash"></i></button></div></td></tr>`).join('');
    }

    // --- BLOGS CRUD ---
    function saveBlog(e) { e.preventDefault(); saveItem('blog', 'umuzi_blogs'); }
    function editBlog(idx) { editItem(idx, 'blog', 'umuzi_blogs'); }
    function deleteBlog(idx) { deleteItem(idx, 'umuzi_blogs'); }
    function resetBlogForm() { document.getElementById('blogForm').reset(); document.getElementById('blogIndex').value = ""; document.getElementById('blogBlocksContainer').innerHTML = ""; document.getElementById('blogSubmitBtn').innerHTML = `<i class="bi bi-plus-lg"></i> Save Blog`; }

    // --- IMPACTS CRUD ---
    function saveImpact(e) { e.preventDefault(); saveItem('impact', 'umuzi_impacts'); }
    function editImpact(idx) { editItem(idx, 'impact', 'umuzi_impacts'); }
    function deleteImpact(idx) { deleteItem(idx, 'umuzi_impacts'); }
    function resetImpactForm() { document.getElementById('impactForm').reset(); document.getElementById('impactIndex').value = ""; document.getElementById('impactBlocksContainer').innerHTML = ""; document.getElementById('impactSubmitBtn').innerHTML = `<i class="bi bi-plus-lg"></i> Save Report`; }

    // --- ROLES CRUD ---
    function saveRole(e) { 
      e.preventDefault(); 
      const index = document.getElementById('roleIndex').value;
      const title = document.getElementById('roleTitle').value;
      const location = document.getElementById('roleLocation').value;
      const dossier = document.getElementById('roleDossier').value;
      const variant = document.getElementById('roleVariant').value;
      const desc = document.getElementById('roleDesc').value;
      const blocks = extractBlocks('roleBlocksContainer');

      let items = JSON.parse(localStorage.getItem('umuzi_roles')) || [];
      const data = { title, location, dossier, variant, desc, blocks };

      if (index === "") items.push(data); else items[index] = data;

      try { localStorage.setItem('umuzi_roles', JSON.stringify(items)); resetRoleForm(); renderData(); } 
      catch (error) { alert("Storage Limit Exceeded or Error: " + error.message); }
    }
    
    function editRole(idx) {
      const roles = JSON.parse(localStorage.getItem('umuzi_roles'));
      const r = roles[idx];
      document.getElementById('roleIndex').value = idx;
      document.getElementById('roleTitle').value = r.title || '';
      document.getElementById('roleLocation').value = r.location || '';
      document.getElementById('roleDossier').value = r.dossier || '';
      document.getElementById('roleVariant').value = r.variant || '';
      document.getElementById('roleDesc').value = r.desc || '';
      renderBlocksIntoContainer('roleBlocksContainer', r.blocks || []);
      document.getElementById('roleSubmitBtn').innerHTML = `<i class="bi bi-check-lg"></i> Save Changes`;
    }

    function deleteRole(idx) { deleteItem(idx, 'umuzi_roles'); }
    function resetRoleForm() { document.getElementById('roleForm').reset(); document.getElementById('roleIndex').value = ""; document.getElementById('roleBlocksContainer').innerHTML = ""; document.getElementById('roleSubmitBtn').innerHTML = `<i class="bi bi-plus-lg"></i> Save Role`; }

    // --- GENERIC CRUD HELPERS ---
    function saveItem(prefix, storageKey) {
      const index = document.getElementById(`${prefix}Index`).value;
      const data = {
        title: document.getElementById(`${prefix}Title`).value,
        author: document.getElementById(`${prefix}Author`).value,
        date: document.getElementById(`${prefix}Date`).value,
        variant: document.getElementById(`${prefix}Variant`).value,
        blocks: extractBlocks(`${prefix}BlocksContainer`)
      };
      let items = JSON.parse(localStorage.getItem(storageKey)) || [];
      if (index === "") items.push(data); else items[index] = data;
      try { localStorage.setItem(storageKey, JSON.stringify(items)); window[`reset${prefix.charAt(0).toUpperCase() + prefix.slice(1)}Form`](); renderData(); } 
      catch (error) { alert("Storage Limit Exceeded or Error: " + error.message); }
    }

    function editItem(idx, prefix, storageKey) {
      const items = JSON.parse(localStorage.getItem(storageKey));
      const item = items[idx];
      document.getElementById(`${prefix}Index`).value = idx;
      document.getElementById(`${prefix}Title`).value = item.title || '';
      document.getElementById(`${prefix}Author`).value = item.author || '';
      document.getElementById(`${prefix}Date`).value = item.date || '';
      document.getElementById(`${prefix}Variant`).value = item.variant || '';
      renderBlocksIntoContainer(`${prefix}BlocksContainer`, item.blocks || []);
      document.getElementById(`${prefix}SubmitBtn`).innerHTML = `<i class="bi bi-check-lg"></i> Save Changes`;
      window.scrollTo(0, 0);
    }

    function deleteItem(idx, storageKey) {
      if (confirm("Are you sure you want to delete this item?")) {
        let items = JSON.parse(localStorage.getItem(storageKey));
        items.splice(idx, 1);
        localStorage.setItem(storageKey, JSON.stringify(items));
        renderData();
      }
    }

    // Secure Logout destroys the token and redirects
    function handleLogout() { 
      if (confirm("Terminate active admin session?")) { 
        sessionStorage.removeItem('umuzi_auth_token');
        window.location.href = "loginPage.html"; 
      } 
    }

    renderData();
  </script>
</body>
</html>
